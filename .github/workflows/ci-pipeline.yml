name: CI Actions Pipeline

on:
  pull_request:
    branches: [dev,test]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: 
    #- kubernetes #Runner on-premise
    - ubuntu-latest #Runner cloud (default)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Build in maven
        uses: codeparce/ci-workflows/.github/actions/build/maven@v1

  scan-repository:
    name: Scan (${{ matrix.scanner.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        scanner:
          - name: Filesystem
            scan-type: fs
            scanners: "vuln,secret"
            output: trivy-fs.sarif
            exit-code: "0" # bypass

          - name: IaC & Configs
            scan-type: config
            scanners: ""
            output: trivy-conf.sarif
            exit-code: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: ${{ matrix.scanner.scan-type }}
          scan-ref: '.'
          scanners: ${{ matrix.scanner.scanners }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: table
          output: trivy-results.txt
          exit-code: ${{ matrix.scanner.exit-code }}

      - name: Summary of Trivy Scan Results
        if: always()
        uses: codeparce/ci-workflows/.github/actions/github/summary@v1
        with:
          scaner-name: ${{ matrix.scanner.name }}
          report-file: trivy-results.txt


  docker-publish:
    needs: [  build, scan-repository]
    permissions:
      contents: read
      packages: write
    runs-on: 
    #- kubernetes #Runner on-premise
    - ubuntu-latest #Runner cloud (default)
    steps:
      - uses: actions/checkout@v4
          
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: service-build
          path: target

      - name: Publish to Docker Hub
        uses: codeparce/ci-workflows/.github/actions/docker@v1
        with:
          target-branch: ${{ github.base_ref }}
          account-name: ${{ secrets.DOCKER_ACCOUNT_NAME}}
          access-token: ${{ secrets.DOCKER_ACCESS_TOKEN }}


  scan-image:
    name: Scan Docker Image
    needs: docker-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_ACCOUNT_NAME}}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_ACCOUNT_NAME}}/${{ github.event.repository.name }}:${{ github.base_ref }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-results.txt
          exit-code: '1'

      - name: Summary of Trivy Scan Results
        if: always()
        uses: codeparce/ci-workflows/.github/actions/github/summary@v1
        with:
          scaner-name: Image Scaner
          report-file: trivy-results.txt