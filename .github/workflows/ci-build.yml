name: CD Build Pipeline

on:
  push:
    branches: [test,main]
      
jobs:
  build:
    name: Build Applications
    runs-on: 
    - kubernetes #Runner cloud (default)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Build in maven
        with:
          skip-tests: true
        uses: codeparce/ci-workflows/.github/actions/build/maven@v1

  docker-publish:
    name: Dokcer Publish
    needs: [ build]
    permissions:
      contents: read
      packages: write
    runs-on: 
    - kubernetes #Runner on-premise
    #- ubuntu-latest #Runner cloud (default)
    steps:
      - uses: actions/checkout@v4
          
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: service-build
          path: target

      - name: Publish to Docker Hub
        uses: codeparce/ci-workflows/.github/actions/docker@v1
        with:
          target-branch: ${{github.ref_name}}-${{ github.sha }}
          account-name: ${{ secrets.DOCKER_ACCOUNT_NAME}}
          access-token: ${{ secrets.DOCKER_ACCESS_TOKEN }}


  scan-image:
    name: Scan Docker Image
    needs: docker-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_ACCOUNT_NAME}}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_ACCOUNT_NAME}}/${{ github.event.repository.name }}:${{github.ref_name}}-${{ github.sha }}
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-results.txt
          exit-code: '1' # bypass

      - name: Summary of Trivy Scan Results
        if: always()
        uses: codeparce/ci-workflows/.github/actions/github/summary@v1
        with:
          scaner-name: Image Scaner
          report-file: trivy-results.txt
