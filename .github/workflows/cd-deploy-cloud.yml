name: CD Actions Pipeline (deploy aws)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-deploy:
    name: Deploy Terraform
    env:
      TARGET_BRANCH: ${{ github.ref_name }}
      GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configurar credenciales AWS mediante OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_STATE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get parameters
        uses: codeparce/ci-workflows/.github/actions/aws/parameters@v1
        with:
          path-parameter: /$GITHUB_REPOSITORY_NAME/$TARGET_BRANCH

      - name: Set env
        uses: codeparce/ci-workflows/.github/actions/github/env@v1
        with:
          env-file: .env
          env-template: .env.template

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Init && Templeate config
        run: | 
         envsubst < provider.tf.template> provider.tf
         terraform init 

      - name: Deploy en aws
        run: |
          terraform apply -auto-approve  > salida.log 2> errores.log
          echo "✅ Deploy completado"
